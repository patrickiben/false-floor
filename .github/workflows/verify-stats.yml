name: verify-stats

# Runs the paper's statistical-verification suite on a clean clone.
# These checks need NO image data and NO torch: they prove the Clopper-Pearson
# bound behind every false-eat / false-safe rate is correct (property-based +
# differential vs scipy/statsmodels, and a SymPy/mpmath symbolic re-derivation).

on:
  push:
    branches: [main]
    paths:
      - 'code/cp_bounds.py'
      - 'code/test_cp_bounds.py'
      - 'code/verify_cp_symbolic.py'
      - 'code/hard_pairs.py'
      - 'code/hard_regime.py'
      - 'code/pairs_encoders.py'
      - 'code/case3_snakes.py'
      - 'code/case6_berries.py'
      - '.github/workflows/verify-stats.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification dependencies (no torch, no image data)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy hypothesis statsmodels sympy mpmath
      - name: Property-based + differential check of the Clopper-Pearson bound
        working-directory: code
        run: python test_cp_bounds.py
      - name: Symbolic re-derivation + 30-digit cross-check
        working-directory: code
        run: python verify_cp_symbolic.py
