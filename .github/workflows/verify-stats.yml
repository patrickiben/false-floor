name: verify-stats

# Runs the deterministic, offline pre-submission checks on a clean clone.
# NO image data and NO torch. It proves the Clopper-Pearson bound behind every
# false-eat / false-safe rate is correct (property-based + differential vs
# scipy/statsmodels, and a SymPy/mpmath symbolic re-derivation), guards against
# machine-specific absolute paths, and scrubs the manuscript source for stray
# AI artifacts / placeholders. (The network citation-integrity gate runs in
# tools/presubmit.sh, not here.)

on:
  push:
    branches: [main]
    paths:
      - 'code/**.py'
      - 'tools/**'
      - 'paper/MANUSCRIPT_CAUTIONARY.md'
      - 'paper/main.tex'
      - 'paper/_body.tex'
      - 'paper/_abstract.tex'
      - '.github/workflows/verify-stats.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification dependencies (no torch, no image data)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy hypothesis statsmodels sympy mpmath
      - name: Absolute-path guard (no machine-specific paths in code)
        run: bash tools/check_paths.sh
      - name: Property-based + differential check of the Clopper-Pearson bound
        working-directory: code
        run: python test_cp_bounds.py
      - name: Symbolic re-derivation + 30-digit cross-check
        working-directory: code
        run: python verify_cp_symbolic.py
      - name: Scrub manuscript source for AI artifacts / placeholders
        run: python tools/scrub_ai_artifacts.py paper/MANUSCRIPT_CAUTIONARY.md paper/main.tex paper/_body.tex paper/_abstract.tex
